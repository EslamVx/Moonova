<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#994DEC"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#994DEC" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="470" cy="512" r="300" fill="#fff"/>
      <circle cx="590" cy="462" r="255" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- film perforation ring -->
  <circle cx="512" cy="512" r="415" fill="none" stroke="url(#g)" stroke-width="16"
          stroke-dasharray="26 34" stroke-linecap="round" opacity="0.35"/>

  <!-- moon glow -->
  <g filter="url(#soft)" opacity="0.7">
    <rect width="1024" height="1024" fill="url(#g)" mask="url(#crescent)"/>
  </g>
  <!-- crescent -->
  <rect width="1024" height="1024" fill="url(#g)" mask="url(#crescent)"/>

  <!-- play button inside the moon -->
  <path d="M552 452 L552 572 L656 512 Z" fill="#fff" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="770" cy="270" r="6" opacity="0.9"/>
    <circle cx="830" cy="360" r="3.5" opacity="0.6"/>
    <circle cx="735" cy="770" r="4.5" opacity="0.7"/>
    <circle cx="280" cy="230" r="3.5" opacity="0.5"/>
  </g>
</svg>
